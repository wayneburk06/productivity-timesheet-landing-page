<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Black circle background -->
  <circle cx="50" cy="50" r="46" fill="#000000"/>
  <!-- Clock face outline -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="white" stroke-width="3.5"/>
  <!-- Hour hand (pointing to ~9) -->
  <line x1="50" y1="50" x2="28" y2="50" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Minute hand (pointing to ~12) -->
  <line x1="50" y1="50" x2="50" y2="23" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="2.5" fill="white"/>
</svg>
