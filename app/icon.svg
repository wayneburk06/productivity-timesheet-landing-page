<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Dark circle background -->
  <circle cx="50" cy="50" r="46" fill="#1a1a1a"/>
  <!-- Clock face ring -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="white" stroke-width="4"/>
  <!-- Hour hand (~9 o'clock) -->
  <line x1="50" y1="50" x2="25" y2="50" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Minute hand (~12 o'clock) -->
  <line x1="50" y1="50" x2="50" y2="24" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="3" fill="white"/>
</svg>
